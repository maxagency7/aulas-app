<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aulas Mili">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Aulas da Mili</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1B2F5B;--blue:#1F4189;--deep:#1B3A78;--soft:#DCE8F7;--line:#B9CDEE;--bg:#F5F8FD;--muted:#43578A;--peach:#F2B8A2}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;font-weight:500;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:max(env(safe-area-inset-top),1px);background:#1B3A78;z-index:40}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:120px}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
.band{position:relative;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 24px 0;overflow:hidden}
.band svg.bg{position:absolute;left:0;top:0;width:100%;height:100%}
.band .in{position:relative;z-index:1}
.band .tiny{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#DCE8F7}
.band h1{font-size:36px;line-height:1.08;margin-top:4px}
.gear{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 12px);z-index:2;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.18);display:grid;place-items:center}
.scal{display:block;width:100%;height:24px;margin-top:-1px}
.week{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0}
.week .arrow{width:32px;height:44px;border:0;background:none;display:grid;place-items:center}
.day{width:42px;border:0;background:none;text-align:center;padding:0}
.day small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.day b{display:block;margin-top:4px;height:42px;line-height:42px;border-radius:21px;font-size:16px}
.day.sel b{background:var(--blue);color:#fff}
.day.today b{box-shadow:inset 0 0 0 2px var(--blue)}
.dots{height:7px;display:flex;justify-content:center;gap:3px;margin-top:3px}
.dots i{width:5px;height:5px;border-radius:3px;background:#7C9BD6}
.sec{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-style:italic;font-weight:500;font-size:22px}
.sec-h span{font-size:13px;color:var(--blue);font-weight:700;white-space:nowrap}
.row{display:flex;gap:10px}
.time{width:46px;flex:none;font-size:14px;font-weight:700;padding-top:14px}
.time small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.card{flex:1;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.card.off{opacity:.6}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .n{font-family:'Fraunces',serif;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .a{font-size:13px;color:var(--muted);margin-top:3px}
.chip{font-size:11px;font-weight:700;background:var(--soft);color:var(--ink);padding:4px 9px;border-radius:12px;white-space:nowrap}
.chip.ok{background:#D6EFE2;color:#164A2F}.chip.warn{background:#F9E1D6;color:#7A2E14}.chip.gray{background:#E6E9F0;color:#3A4560}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{min-height:44px;flex:1;border-radius:14px;font-weight:700;font-size:14px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);padding:0 12px}
.btn.pri{background:var(--blue);color:#fff}
.btn.danger{border-color:#B42318;color:#B42318}
.btn.ghost{border-color:transparent;background:var(--soft);color:var(--ink)}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:18px;padding:24px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin:14px auto 0;display:block;max-width:240px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none}
.nav .pill{max-width:448px;margin:0 auto;height:68px;border-radius:34px;background:var(--deep);display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 24px rgba(27,58,120,.35);padding:0 8px;pointer-events:auto}
.nav button{width:58px;height:58px;border:0;background:none;border-radius:29px;color:#fff;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button.on{background:#fff;color:var(--deep)}
.nav button.fab{width:54px;height:54px;background:var(--peach);color:var(--ink);margin-top:-2px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(27,47,91,.15)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav h3{font-size:20px;text-align:center;flex:1}
.pnav button{width:44px;height:44px;background:#fff;border:1.5px solid var(--line);border-radius:22px;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.tile small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tile b{font-family:'Quicksand',sans-serif;font-weight:700;font-size:21px;white-space:nowrap}
.tile.dk{background:var(--deep);border-color:var(--deep);color:#fff}.tile.dk small{color:#CFE0FA}
.list{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #E3ECF8;min-height:52px}
.li:first-child{border-top:0}
.li .g{flex:1;min-width:0}.li .g b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .g small{color:var(--muted);font-size:13px}
.li .r{font-weight:700;white-space:nowrap}
.bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
select,input,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;font-size:16px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.ov{position:fixed;inset:0;background:rgba(15,25,50,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 22px)}
.sh h2{font-size:24px;margin-bottom:2px}
.sh .x{float:right;width:40px;height:40px;border:0;border-radius:20px;background:var(--soft);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:46px;min-height:44px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hint{font-size:13px;color:var(--muted);margin-top:6px}.hint.warn{color:#9A3412}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 14px 0}
.mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.mc{background:#fff;border:1.5px solid #E3ECF8;border-radius:12px;min-height:58px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.mc b{font-size:15px}
.mc.out{opacity:.4}
.mc.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.mc.today{box-shadow:inset 0 0 0 2px var(--peach)}
.md{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px;padding:0 2px}
.md i{width:6px;height:6px;border-radius:3px}
.mc.sel .md i{box-shadow:0 0 0 1.5px #fff}
.mc small{font-size:10px;font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);padding:10px 20px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:5px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
/* ===== dados ===== */
const KEY='mili.aulas.v1';
const fresh=()=>({students:[],lessons:[],fees:{},nf:{},settings:{name:'Mili',pix:''}});
const norm=d=>{d.settings=d.settings||{name:'Mili',pix:''};d.fees=d.fees||{};d.nf=d.nf||{};return d};
let db=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.students&&d.lessons)return norm(d)}catch(e){}return fresh()})();
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const S=id=>db.students.find(s=>s.id===id);
const L=id=>db.lessons.find(l=>l.id===id);

/* ===== utilidades ===== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wStart=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const DOW=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const DOWL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DOWS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MON=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dm=s=>{const [,m,d]=s.split('-');return d+'/'+m};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=n=>(n||'').trim().split(/\s+/)[0];
const dtOf=l=>{const [h,m]=l.time.split(':').map(Number);const d=parse(l.date);d.setHours(h,m,0,0);return d};
const isDone=l=>l.status!=='cancelada'&&new Date(dtOf(l).getTime()+l.dur*60000)<=new Date();
const cmp=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const tHuman=t=>{const [h,m]=t.split(':');return m==='00'?h+'h':h+'h'+m};
const todayS=()=>ymd(new Date());
const ymOf=d=>d.slice(0,7);
const endT=l=>{const e=new Date(dtOf(l).getTime()+l.dur*60000);return pad(e.getHours())+':'+pad(e.getMinutes())};
const hoursFmt=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return m?h+'h'+pad(m):h+'h'};

/* tipos de cliente e pagamento */
const KC={aluno:'#1F4189',fundacao:'#D9693F',escola:'#2F8F6B'};
const KL={aluno:'Aluno',fundacao:'Fundação',escola:'Escola'};
const PL={aula:'por aula',hora:'por hora',mensal:'mensal'};
const kindOf=s=>s.kind||'aluno';
const payOf=s=>s.pay||'aula';
const isClt=s=>kindOf(s)==='escola'&&s.vinc==='clt';
const priceFor=(s,dur)=>payOf(s)==='hora'?Math.round(s.price*dur/60*100)/100:payOf(s)==='mensal'?0:s.price;

/* ===== ícones ===== */
const IC={
 home:'<path d="M3 11 12 4l9 7v9H3z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6M16 5a3.5 3.5 0 0 1 0 6M19 14c1.5.8 2.5 2.5 2.5 6"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6v1.5M12 16.5V18"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'
};
const ic=(n,sz=22,c='currentColor')=>`<svg aria-hidden="true" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ===== estado de tela ===== */
const ui={tab:'hoje',view:'week',sel:todayS(),rep:{mode:'week',ref:todayS(),sid:'all'},sheet:null};
const $app=document.getElementById('app'),$sheet=document.getElementById('sheet'),$toast=document.getElementById('toast');
function toast(t){$toast.textContent=t;$toast.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>$toast.classList.remove('on'),2600)}
function openUrl(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}

/* ===== mensagens ===== */
function waLink(phone,text){let d=(phone||'').replace(/\D/g,'');if(d&&d.length<=11&&!d.startsWith('55'))d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(text)}
const hello=s=>kindOf(s)==='aluno'?`Oi, ${first(s.name)}! Tudo bem? 😊`:`Olá, ${s.name}! Tudo bem? 😊`;
function whenTxt(l){return l.date===todayS()?'de hoje':'do dia '+dm(l.date)+' ('+DOWL[parse(l.date).getDay()].toLowerCase()+')'}
function confirmMsg(l){const s=S(l.sid);return `${hello(s)}\nPassando pra confirmar a aula ${whenTxt(l)} às ${tHuman(l.time)}. Está tudo certo?`}
function moveMsg(l){const s=S(l.sid);return `${hello(s)}\nNossa aula ficou remarcada para ${DOWL[parse(l.date).getDay()].toLowerCase()}, ${dm(l.date)}, às ${tHuman(l.time)}. Pode ser?`}
const cobTotal=(sid,o)=>o.ls.reduce((a,l)=>a+l.price,0)+o.fees.length*S(sid).price;
function chargeMsg(sid,o){const s=S(sid);
 const lines=o.ls.map(l=>'• '+dm(l.date)+(payOf(s)==='hora'?' ('+hoursFmt(l.dur)+')':'')+(l.status==='falta'?' (falta sem aviso)':'')).concat(o.fees.map(y=>'• Mensalidade de '+MON[+y.slice(5)-1]));
 let m=`${hello(s)}\nPassando pra fechar nossas aulas:\n${lines.join('\n')}\n\nTotal: ${brl(cobTotal(sid,o))}`;
 if(db.settings.pix)m+=`\nPix: ${db.settings.pix}`;
 return m+`\n\nQuando puder, me avisa por aqui. Obrigada! 💙`}

/* ===== calendário (.ics / Google) ===== */
const fLocal=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsFor(ls){
 const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aulas da Mili//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
 ls.forEach(l=>{const s=S(l.sid);if(!s)return;const st=dtOf(l),en=new Date(st.getTime()+l.dur*60000);
  out.push('BEGIN:VEVENT','UID:'+l.id+'@aulas-mili','DTSTAMP:'+stamp,'DTSTART:'+fLocal(st),'DTEND:'+fLocal(en),
   'SUMMARY:'+icsEsc((kindOf(s)==='aluno'?'Aula - ':'')+s.name),'LOCATION:'+icsEsc(s.addr),'DESCRIPTION:'+icsEsc(KL[kindOf(s)]+': '+s.name+(s.phone?'\nWhatsApp: '+s.phone:'')),
   'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Compromisso em 1 hora','END:VALARM','END:VEVENT')});
 out.push('END:VCALENDAR');return out.join('\r\n')
}
function downloadIcs(ls,name){const b=new Blob([icsFor(ls)],{type:'text/calendar;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name||'aulas.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function gcalLink(l){const s=S(l.sid),st=dtOf(l),en=new Date(st.getTime()+l.dur*60000);return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent((kindOf(s)==='aluno'?'Aula - ':'')+s.name)+'&dates='+fLocal(st)+'/'+fLocal(en)+'&location='+encodeURIComponent(s.addr||'')+'&details='+encodeURIComponent(s.name)}
function uberLink(l){const s=S(l.sid);return 'https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[formatted_address]='+encodeURIComponent(s.addr||'')+'&dropoff[nickname]='+encodeURIComponent(s.name)}

/* ===== cabeçalho ===== */
const TILE=`<defs><pattern id="tile" width="52" height="52" patternUnits="userSpaceOnUse"><rect width="52" height="52" fill="#274A8F"/><g fill="none" stroke="#6F93D4" stroke-width="1.6"><circle cx="26" cy="26" r="6"/><path d="M26 6c6 8 6 12 0 20-6-8-6-12 0-20ZM26 46c6-8 6-12 0-20-6 8-6 12 0 20ZM6 26c8-6 12-6 20 0-8 6-12 6-20 0ZM46 26c-8-6-12-6-20 0 8 6 12 6 20 0Z"/><circle cx="0" cy="0" r="8"/><circle cx="52" cy="0" r="8"/><circle cx="0" cy="52" r="8"/><circle cx="52" cy="52" r="8"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#tile)"/><rect width="100%" height="100%" fill="#1B3A78" opacity=".55"/>`;
const SCAL=`<svg class="scal" viewBox="0 0 390 24" preserveAspectRatio="none" aria-hidden="true"><g fill="#1B3A78">${Array.from({length:14},(_,i)=>`<circle cx="${i*30}" cy="0" r="16"/>`).join('')}</g></svg>`;
function band(tiny,title){return `<div class="band" style="padding-bottom:22px"><svg class="bg" aria-hidden="true">${TILE}</svg><button class="gear" data-act="settings" aria-label="Configurações">${ic('gear',22,'#fff')}</button><div class="in"><div class="tiny">${tiny}</div><h1>${title}</h1></div></div>${SCAL}`}

/* ===== telas ===== */
function monthPos(l){const ym=ymOf(l.date);const all=db.lessons.filter(x=>x.sid===l.sid&&x.status!=='cancelada'&&ymOf(x.date)===ym).sort(cmp);return [all.findIndex(x=>x.id===l.id)+1,all.length]}
function lessonCard(l,withBtns){
 const s=S(l.sid);if(!s)return '';
 const can=l.status==='cancelada',done=isDone(l),k=kindOf(s);
 let tag;
 if(can)tag='<span class="chip gray">cancelada</span>';
 else if(l.status==='falta')tag='<span class="chip warn">falta · cobrada</span>';
 else if(done)tag=l.paid?'<span class="chip ok">pago</span>':'<span class="chip ok">feita</span>';
 else if(k==='aluno'){const [n,m]=monthPos(l);tag=`<span class="chip">${n} de ${m}</span>`}
 else tag=`<span class="chip" style="background:${k==='escola'?'#D6EFE2':'#FBE0D3'}">${KL[k]}${isClt(s)?' · CLT':''}</span>`;
 const sub=(s.addr||'Sem endereço')+(l.moved?' · remarcada':'');
 return `<div class="row"><div class="time">${l.time}<small>${endT(l)}</small></div><div class="card ${can?'off':''}" style="border-left:6px solid ${KC[k]}"><div data-act="edit-lesson" data-arg="${l.id}" style="cursor:pointer"><div class="t"><div class="n">${esc(s.name)}</div>${tag}</div><div class="a">${esc(sub)}</div></div>${withBtns&&!can&&!done?`<div class="btns"><button class="btn" data-act="confirm" data-arg="${l.id}">Confirmar aula</button><button class="btn pri" data-act="uber" data-arg="${l.id}">Abrir Uber</button></div>`:''}</div></div>`}

function monthGrid(){
 const sel=parse(ui.sel),y=sel.getFullYear(),m=sel.getMonth(),today=todayS();
 const first=new Date(y,m,1),start=addDays(first,-((first.getDay()+6)%7));
 const by={};db.lessons.forEach(l=>{if(l.status!=='cancelada'&&S(l.sid))(by[l.date]=by[l.date]||[]).push(l)});
 let cells=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(d=>`<div class="mh">${d}</div>`).join('');
 for(let i=0;i<42;i++){const d=addDays(start,i);if(i>=35&&d.getMonth()!==m)break;const k=ymd(d),ls=by[k]||[];
  const dots=ls.slice(0,4).map(l=>`<i style="background:${KC[kindOf(S(l.sid))]}"></i>`).join('');
  cells+=`<button class="mc ${k===ui.sel?'sel':''} ${k===today?'today':''} ${d.getMonth()===m?'':'out'}" data-act="day" data-arg="${k}" aria-label="${d.getDate()} de ${MON[d.getMonth()]}, ${ls.length} aula${ls.length===1?'':'s'}"><b>${d.getDate()}</b><div class="md">${dots}</div>${ls.length?`<small>${ls.length}</small>`:''}</button>`}
 return `<div class="pnav" style="padding:8px 16px 0"><button data-act="mnav" data-arg="-1" aria-label="Mês anterior">${ic('left',20)}</button><h3>${cap(MON[m])} ${y}</h3><button data-act="mnav" data-arg="1" aria-label="Próximo mês">${ic('right',20)}</button></div><div class="mgrid">${cells}</div><div class="legend">${['aluno','fundacao','escola'].map(k=>`<span><i style="background:${KC[k]}"></i>${KL[k]}</span>`).join('')}</div>`}

function vHoje(){
 const sel=parse(ui.sel),ws=wStart(sel),today=todayS();
 const h=new Date().getHours();const hi=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
 let cal;
 if(ui.view==='month')cal=monthGrid();
 else{let strip='';for(let i=0;i<7;i++){const d=addDays(ws,i),k=ymd(d);const c=Math.min(3,db.lessons.filter(l=>l.date===k&&l.status!=='cancelada').length);
  strip+=`<button class="day ${k===ui.sel?'sel':''} ${k===today?'today':''}" data-act="day" data-arg="${k}" aria-label="${DOWL[d.getDay()]} ${d.getDate()}"><small>${DOW[d.getDay()]}</small><b>${d.getDate()}</b><div class="dots">${'<i></i>'.repeat(c)}</div></button>`}
  cal=`<div class="week"><button class="arrow" data-act="wk" data-arg="-7" aria-label="Semana anterior">${ic('left',20)}</button>${strip}<button class="arrow" data-act="wk" data-arg="7" aria-label="Próxima semana">${ic('right',20)}</button></div>`}
 const ls=db.lessons.filter(l=>l.date===ui.sel).sort(cmp);
 const act=ls.filter(l=>l.status!=='cancelada');const tot=act.reduce((a,l)=>a+l.price,0);
 const label=ui.sel===today?'Hoje':DOWL[sel.getDay()]+', '+sel.getDate()+' de '+MON[sel.getMonth()];
 let body;
 if(!db.students.length)body=`<div class="empty"><h3>Vamos começar?</h3>Cadastre o primeiro aluno, fundação ou escola para agendar.<button class="btn pri" data-act="student-new">Cadastrar</button></div>`;
 else if(!ls.length)body=`<div class="empty"><h3>Nada marcado neste dia</h3>Que tal agendar uma aula?<button class="btn pri" data-act="new">Agendar</button></div>`;
 else body=ls.map(l=>lessonCard(l,true)).join('');
 return band(MON[new Date().getMonth()]+' '+new Date().getFullYear(),`${hi}, ${esc(db.settings.name||'Mili')}`)+
 `<div style="padding:12px 20px 0"><div class="seg"><button class="${ui.view!=='month'?'on':''}" data-act="view" data-arg="week">Semana</button><button class="${ui.view==='month'?'on':''}" data-act="view" data-arg="month">Mês</button></div></div>${cal}
 <div class="sec"><div class="sec-h"><h2>${label}${act.length?`, ${act.length} ${act.length>1?'compromissos':'compromisso'}`:''}</h2>${act.length&&tot?`<span>${brl(tot)}</span>`:''}</div>${body}</div>`}

function vAlunos(){
 const rows=db.students.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<div class="li"><span class="bar" style="background:${KC[kindOf(s)]}"></span><div class="g" data-act="student-edit" data-arg="${s.id}" style="cursor:pointer;padding:4px 0"><b>${esc(s.name)}</b><small>${KL[kindOf(s)]}${isClt(s)?' · CLT':''} · ${brl(s.price)} ${PL[payOf(s)]}${kindOf(s)==='aluno'?' · '+s.perWeek+'x/sem':''}</small></div><button class="btn ghost" style="flex:none;min-width:44px;padding:0 12px" data-act="student-wa" data-arg="${s.id}" aria-label="WhatsApp de ${esc(s.name)}">WhatsApp</button></div>`).join('');
 return band('Cadastro','Clientes')+`<div class="sec"><button class="btn pri" data-act="student-new" style="flex:none">+ Novo cliente</button>${rows?`<div class="list">${rows}</div>`:`<div class="empty"><h3>Nenhum cliente ainda</h3>Toque em “Novo cliente” para começar.</div>`}</div>`}

/* relatórios */
function repRange(){const r=ui.rep,ref=parse(r.ref);
 if(r.mode==='week'){const a=wStart(ref),b=addDays(a,6);return {a:ymd(a),b:ymd(b),label:a.getDate()+' '+MON[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+MON[b.getMonth()].slice(0,3)}}
 const a=new Date(ref.getFullYear(),ref.getMonth(),1),b=new Date(ref.getFullYear(),ref.getMonth()+1,0);return {a:ymd(a),b:ymd(b),label:cap(MON[a.getMonth()])+' '+a.getFullYear()}}
function repData(){const {a,b}=repRange();const sid=ui.rep.sid;return db.lessons.filter(l=>l.date>=a&&l.date<=b&&l.status!=='cancelada'&&S(l.sid)&&(sid==='all'||l.sid===sid)).sort(cmp)}
function feesIn(){if(ui.rep.mode!=='month')return [];const y=repRange().a.slice(0,7),sid=ui.rep.sid;
 return db.students.filter(s=>payOf(s)==='mensal'&&(sid==='all'||s.id===sid)&&db.lessons.some(l=>l.sid===s.id&&l.status!=='cancelada'&&ymOf(l.date)===y)).map(s=>({sid:s.id,value:s.price,paid:!!db.fees[s.id+':'+y],ym:y}))}
function repSums(){const ls=repData(),fs=feesIn();
 const tot=ls.reduce((a,l)=>a+l.price,0)+fs.reduce((a,f)=>a+f.value,0);
 const rec=ls.filter(l=>l.paid).reduce((a,l)=>a+l.price,0)+fs.filter(f=>f.paid).reduce((a,f)=>a+f.value,0);
 return {ls,fs,tot,rec,mins:ls.reduce((a,l)=>a+l.dur,0)}}
function groupBy(ls){const g={};ls.forEach(l=>(g[l.sid]=g[l.sid]||[]).push(l));return g}
function repText(){const r=repRange(),{ls,fs,tot,rec,mins}=repSums();
 let t=`Relatório de aulas – ${r.label}\n`;if(ui.rep.sid!=='all')t+=`Cliente: ${S(ui.rep.sid).name}\n`;t+='\n';
 const g=groupBy(ls);Object.keys(g).forEach(k=>{const s=S(k),fee=fs.find(f=>f.sid===k),v=g[k].reduce((a,l)=>a+l.price,0)+(fee?fee.value:0);t+=`${s.name}: ${g[k].length} aula(s), ${hoursFmt(g[k].reduce((a,l)=>a+l.dur,0))} – ${brl(v)}${payOf(s)==='mensal'?' (mensal)':''}\n`});
 return t+`\nTotal: ${ls.length} aula(s), ${hoursFmt(mins)} – ${brl(tot)}\nRecebido: ${brl(rec)}\nA receber: ${brl(tot-rec)}`}
function vRel(){
 const r=repRange(),{ls,fs,tot,rec,mins}=repSums();
 const opts=`<option value="all">Todos</option>`+db.students.map(s=>`<option value="${s.id}" ${ui.rep.sid===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
 let det='';
 if(!ls.length)det=`<div class="empty">Nenhuma aula neste período.</div>`;
 else if(ui.rep.sid==='all'){const g=groupBy(ls);
  det='<div class="list">'+Object.keys(g).map(k=>{const s=S(k),arr=g[k],fee=fs.find(f=>f.sid===k),v=arr.reduce((a,l)=>a+l.price,0)+(fee?fee.value:0);
   return `<div class="li"><span class="bar" style="background:${KC[kindOf(s)]}"></span><div class="g"><b>${esc(s.name)}</b><small>${arr.length} aula${arr.length>1?'s':''} · ${hoursFmt(arr.reduce((a,l)=>a+l.dur,0))}${isClt(s)?' · CLT':''}${payOf(s)==='mensal'?' · mensal':''}</small></div><div class="r">${brl(v)}</div></div>`}).join('')+'</div>'}
 else det='<div class="list">'+ls.map(l=>`<div class="li" data-act="edit-lesson" data-arg="${l.id}" style="cursor:pointer"><div class="g"><b>${DOWS[parse(l.date).getDay()]}, ${dm(l.date)}</b><small>${l.time}–${endT(l)} · ${l.paid?'pago':isDone(l)?'a receber':'agendada'}${l.status==='falta'?' · falta':''}</small></div><div class="r">${payOf(S(l.sid))==='mensal'?'—':brl(l.price)}</div></div>`).join('')+fs.map(f=>`<div class="li"><div class="g"><b>Mensalidade</b><small>${f.paid?'pago':'a receber'}${S(f.sid).nf?(db.nf[f.sid+':'+f.ym]?' · NF emitida':' · NF pendente'):''}</small></div><div class="r">${brl(f.value)}</div></div>`).join('')+'</div>';
 const hasMensal=ui.rep.mode==='week'&&db.students.some(s=>payOf(s)==='mensal'&&(ui.rep.sid==='all'||ui.rep.sid===s.id)&&db.lessons.some(l=>l.sid===s.id&&l.date>=r.a&&l.date<=r.b&&l.status!=='cancelada'));
 return band('Acompanhe seus ganhos','Relatórios')+`<div class="sec">
 <div class="seg"><button class="${ui.rep.mode==='week'?'on':''}" data-act="rmode" data-arg="week">Semana</button><button class="${ui.rep.mode==='month'?'on':''}" data-act="rmode" data-arg="month">Mês</button></div>
 <div class="pnav"><button data-act="rnav" data-arg="-1" aria-label="Anterior">${ic('left',20)}</button><h3>${r.label}</h3><button data-act="rnav" data-arg="1" aria-label="Próximo">${ic('right',20)}</button></div>
 <select id="rsid" aria-label="Cliente">${opts}</select>
 <div class="tiles"><div class="tile dk"><small>Total</small><b>${brl(tot)}</b></div><div class="tile"><small>Aulas · horas</small><b>${ls.length} · ${hoursFmt(mins)}</b></div><div class="tile"><small>Recebido</small><b>${brl(rec)}</b></div><div class="tile"><small>A receber</small><b>${brl(tot-rec)}</b></div></div>
 ${hasMensal?`<div class="hint">Clientes com valor mensal só entram no total no relatório do mês.</div>`:''}
 ${det}
 ${ls.length?`<button class="btn pri" data-act="share-rep" style="flex:none">Compartilhar relatório</button>`:''}</div>`}

/* cobrança */
function pending(){const g={};const get=sid=>g[sid]=g[sid]||{ls:[],fees:[]};
 db.lessons.forEach(l=>{const s=S(l.sid);if(!s||!isDone(l))return;
  if(payOf(s)==='mensal'){const y=ymOf(l.date);if(!db.fees[s.id+':'+y]){const o=get(s.id);if(!o.fees.includes(y))o.fees.push(y)}}
  else if(!l.paid)get(s.id).ls.push(l)});
 Object.values(g).forEach(o=>o.ls.sort(cmp));return g}
function vCobrar(){const g=pending(),ks=Object.keys(g);
 const cards=ks.map(k=>{const s=S(k),o=g[k],tot=cobTotal(k,o),clt=isClt(s);
  const chips=o.ls.map(l=>`<span class="chip">${dm(l.date)}</span>`).join('')+o.fees.map(y=>`<span class="chip">mensal ${MON[+y.slice(5)-1].slice(0,3)}${s.nf?(db.nf[k+':'+y]?' · NF emitida':' · sem NF'):''}</span>`).join('');
  const n=o.ls.length+o.fees.length;
  return `<div class="card" style="border-left:6px solid ${KC[kindOf(s)]}"><div class="t"><div class="n">${esc(s.name)}</div><span class="chip warn">${brl(tot)}</span></div><div class="a">${clt?'Salário CLT · ':''}${n} item${n>1?'s':''} sem pagamento</div><div class="dates">${chips}</div><div class="btns">${clt?'':`<button class="btn pri" data-act="charge" data-arg="${k}">Cobrar no WhatsApp</button>`}<button class="btn" data-act="paid" data-arg="${k}">${clt?'Marcar recebido':'Marcar pago'}</button></div></div>`}).join('');
 const total=ks.reduce((a,k)=>a+cobTotal(k,g[k]),0);
 const nfs=nfPending();
 const nfCards=nfs.length?`<div class="sec-h" style="margin-top:6px"><h2>Notas fiscais a emitir</h2></div>`+nfs.map(n=>`<div class="card" style="border-left:6px solid ${KC[kindOf(S(n.sid))]}"><div class="t"><div class="n">${esc(S(n.sid).name)}</div><span class="chip warn">NF ${cap(MON[+n.ym.slice(5)-1]).slice(0,3)}/${n.ym.slice(2,4)}</span></div><div class="a">Nota de ${MON[+n.ym.slice(5)-1]} ainda não emitida</div><div class="btns"><button class="btn" data-act="nf-done" data-arg="${n.sid}:${n.ym}">Marcar nota emitida</button></div></div>`).join(''):'';
 return band('Mensagem amigável pronta','Cobrar')+`<div class="sec">${ks.length?`<div class="tile dk"><small>Total a receber</small><b>${brl(total)}</b></div>${cards}`:(nfs.length?'':`<div class="empty"><h3>Tudo em dia</h3>Nada pendente de pagamento.</div>`)}${nfCards}</div>`}
function nfPending(){const seen={},out=[];
 db.lessons.forEach(l=>{const s=S(l.sid);if(!s||!s.nf||!isDone(l))return;const y=ymOf(l.date),key=s.id+':'+y;if(!db.nf[key]&&!seen[key]){seen[key]=1;out.push({sid:s.id,ym:y})}});
 return out.sort((a,b)=>a.ym.localeCompare(b.ym))}

function nav(){const t=ui.tab;const b=(k,i,l)=>`<button class="${t===k?'on':''}" data-act="tab" data-arg="${k}">${ic(i,22)}${l}</button>`;
 return `<div class="nav"><div class="pill">${b('hoje','home','Hoje')}${b('alunos','users','Clientes')}<button class="fab" data-act="new" aria-label="Nova aula">${ic('plus',26)}</button>${b('rel','chart','Relatório')}${b('cobrar','coin','Cobrar')}</div></div>`}

const sel=(l,f,opts,v,chg)=>`<label for="f_${f}">${l}</label><select id="f_${f}" data-f="${f}" ${chg?`data-chg="${chg}"`:''}>${opts.map(([k,t])=>`<option value="${k}" ${k===v?'selected':''}>${t}</option>`).join('')}</select>`;

  <div class="two"><div>${fld('Duração padrão (min)','dur',d.dur,'number','min="15" step="5" inputmode="numeric"')}</div><div>${fld('Aulas por semana (guia)','perWeek',d.perWeek,'number','min="1" max="7" inputmode="numeric"')}</div></div>

 else if(sh.type==='new'){const s=S(d.sid);const warn=s&&kindOf(s)==='aluno'&&d.days.length>1&&d.days.length!==s.perWeek;

  <div class="hint ${warn?'warn':''}">${d.days.length?(warn?`${esc(first(s.name))} costuma ter ${s.perWeek} por semana — você marcou ${d.days.length}.`:'Cria uma aula em cada um desses dias, nas próximas semanas.'):'Sem dia marcado: cria uma aula só, na data escolhida abaixo.'}</div>
  <div class="two"><div>${fld(d.days.length?'A partir de':'Data','start',d.start,'date')}</div><div>${fld('Horário','time',d.time,'time')}</div></div>

 else if(sh.type==='done'){const ls=sh.ids.map(L).filter(Boolean);h=`<h2>${ls.length} agendad${ls.length>1?'as':'a'}</h2><p class="hint" style="font-size:15px">Quer colocar no calendário com lembrete 1 hora antes?</p><div class="btns" style="flex-direction:column"><button class="btn pri" data-act="ics-many">Adicionar ao calendário do iPhone / Google</button><button class="btn ghost" data-act="close">Agora não</button></div><p class="hint">O arquivo abre o calendário e você confirma “Adicionar tudo”.</p>`}

  <div class="btns" style="margin-top:16px"><button class="btn pri" data-act="save-lesson">Salvar (remarcar)</button></div>

  ${off?`<div class="btns"><button class="btn pri" data-act="reactivate">Reativar aula</button></div>`:`<label>Se não vai acontecer</label><div class="btns" style="margin-top:0"><button class="btn danger" data-act="cancel-ok">Cancelar (com aviso)</button><button class="btn danger" data-act="cancel-falta">Faltou (cobrar)</button></div>`}

 else if(sh.type==='settings'){h=`<h2>Configurações</h2>${fld('Seu nome','name',db.settings.name,'text')}${fld('Chave Pix (aparece na cobrança)','pix',db.settings.pix,'text','placeholder="CPF, e-mail ou telefone"')}<div class="btns" style="margin-top:16px"><button class="btn pri" data-act="save-settings">Salvar</button></div><label>Backup dos dados</label><div class="btns"><button class="btn" data-act="export">Exportar</button><button class="btn" data-act="import">Importar</button></div><p class="hint">Os dados ficam só neste celular. Exporte de vez em quando para guardar uma cópia.</p>`}
 return `<div class="ov" data-act="ov"><div class="sh" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Fechar">${ic('x',20)}</button>${h}</div></div>`}

function render(){$app.innerHTML=({hoje:vHoje,alunos:vAlunos,rel:vRel,cobrar:vCobrar})[ui.tab]()+nav();$sheet.innerHTML=ui.sheet?sheetHTML():'';
 const r=document.getElementById('rsid');if(r)r.onchange=()=>{ui.rep.sid=r.value;render()}}
function readForm(){if(!ui.sheet)return;$sheet.querySelectorAll('[data-f]').forEach(el=>{ui.sheet.d[el.dataset.f]=el.value})}
function openSheet(type,d,extra){ui.sheet={type,d,...extra};render()}
function closeSheet(){ui.sheet=null;render()}
const num=v=>parseFloat(String(v).replace(',','.'))||0;

/* ===== ações ===== */
function newLessonDraft(sid){const s=S(sid)||db.students[0];return {sid:s.id,days:[],time:'14:00',dur:s.dur||60,start:ui.sel||todayS(),weeks:4}}
const A={
 tab(a){ui.tab=a;render();window.scrollTo(0,0)},
 view(a){ui.view=a;render()},
 day(a){ui.sel=a;render()},
 wk(a){ui.sel=ymd(addDays(parse(ui.sel),+a));render()},
 mnav(a){const s=parse(ui.sel);ui.sel=ymd(new Date(s.getFullYear(),s.getMonth()+ +a,1));render()},
 settings(){openSheet('settings',{})},
 'student-new'(){openSheet('student',{name:'',kind:'aluno',pay:'aula',vinc:'',nf:false,phone:'',addr:'',perWeek:1,dur:60,price:80})},
 'student-edit'(a){openSheet('student',{...S(a),kind:kindOf(S(a)),pay:payOf(S(a)),dur:S(a).dur||60})},
 'student-wa'(a){const s=S(a);openUrl(waLink(s.phone,hello(s).replace(' Tudo bem? 😊','')+' '))},
 'save-student'(){readForm();const d=ui.sheet.d;if(!d.name.trim()){toast('Digite o nome');return}
  const o={name:d.name.trim(),kind:d.kind,pay:d.pay,vinc:d.kind==='escola'?(d.vinc||'clt'):'',nf:d.nf===true||d.nf==='1',phone:d.phone.trim(),addr:d.addr.trim(),perWeek:Math.max(1,parseInt(d.perWeek)||1),dur:Math.max(15,parseInt(d.dur)||60),price:Math.max(0,num(d.price))};
  if(d.id)Object.assign(S(d.id),o);else db.students.push({id:uid(),...o});save();closeSheet();toast('Salvo')},
 'del-student'(){const d=ui.sheet.d;if(confirm('Excluir este cliente e todas as aulas dele? Isso não pode ser desfeito.')){db.students=db.students.filter(s=>s.id!==d.id);db.lessons=db.lessons.filter(l=>l.sid!==d.id);save();closeSheet();toast('Excluído')}},
 'sched-student'(){openSheet('new',newLessonDraft(ui.sheet.d.id))},
 new(){if(!db.students.length){toast('Cadastre um cliente primeiro');A['student-new']();return}openSheet('new',newLessonDraft(ui.tab==='rel'&&ui.rep.sid!=='all'?ui.rep.sid:null))},
 chip(a){readForm();const d=ui.sheet.d,i=+a;d.days=d.days.includes(i)?d.days.filter(x=>x!==i):[...d.days,i];render()},
 'save-new'(){readForm();const d=ui.sheet.d;const s=S(d.sid),dur=parseInt(d.dur)||60,ids=[];
  const mk=day=>{const l={id:uid(),sid:d.sid,date:ymd(day),time:d.time||'14:00',dur,price:priceFor(s,dur),status:'ok',paid:false};db.lessons.push(l);ids.push(l.id)};
  if(!d.days.length)mk(parse(d.start));
  else{const start=parse(d.start),weeks=Math.max(1,parseInt(d.weeks)||1);for(let i=0;i<weeks*7;i++){const day=addDays(start,i);if(d.days.includes(day.getDay()))mk(day)}}
  save();ui.sel=d.start;ui.tab='hoje';openSheet('done',{},{ids})},
 'ics-many'(){downloadIcs(ui.sheet.ids.map(L).filter(Boolean).sort(cmp))},
 'edit-lesson'(a){openSheet('lesson',{...L(a)})},
 'save-lesson'(){readForm();const d=ui.sheet.d,l=L(d.id),s=S(l.sid),nd=parseInt(d.dur)||60;let price=num(d.price);
  if(s&&payOf(s)==='hora'&&nd!==l.dur&&price===l.price)price=priceFor(s,nd);
  const moved=d.date!==l.date||d.time!==l.time;
  Object.assign(l,{date:d.date,time:d.time,dur:nd,price});if(moved)l.moved=true;save();ui.sel=l.date;closeSheet();toast(moved?'Aula remarcada':'Aula atualizada')},
 'move-wa'(a){const l=L(a),d=ui.sheet&&ui.sheet.d&&ui.sheet.d.id===a?ui.sheet.d:null;if(d){readForm();Object.assign(l,{date:ui.sheet.d.date,time:ui.sheet.d.time})}openUrl(waLink(S(l.sid).phone,moveMsg(l)))},
 'cancel-ok'(){const l=L(ui.sheet.d.id);l.status='cancelada';save();closeSheet();toast('Aula cancelada — não será cobrada')},
 'cancel-falta'(){const l=L(ui.sheet.d.id);l.status='falta';save();closeSheet();toast('Falta registrada — será cobrada')},
 reactivate(){const l=L(ui.sheet.d.id);l.status='ok';save();closeSheet();toast('Aula reativada')},
 'del-lesson'(){if(confirm('Excluir esta aula de vez?')){db.lessons=db.lessons.filter(l=>l.id!==ui.sheet.d.id);save();closeSheet();toast('Aula excluída')}},
 ics(a){downloadIcs([L(a)])},
 gcal(a){openUrl(gcalLink(L(a)))},
 uber(a){const l=L(a);if(!S(l.sid).addr){toast('Sem endereço cadastrado');return}openUrl(uberLink(l))},
 confirm(a){const l=L(a);openUrl(waLink(S(l.sid).phone,confirmMsg(l)))},
 rmode(a){ui.rep.mode=a;render()},
 rnav(a){const r=parse(ui.rep.ref);ui.rep.ref=ymd(ui.rep.mode==='week'?addDays(r,7*a):new Date(r.getFullYear(),r.getMonth()+ +a,1));render()},
 async 'share-rep'(){const t=repText();if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else{try{await navigator.clipboard.writeText(t);toast('Relatório copiado')}catch(e){prompt('Copie o relatório:',t)}}},
 charge(a){const o=pending()[a];if(o)openUrl(waLink(S(a).phone,chargeMsg(a,o)))},
 paid(a){const o=pending()[a];if(!o)return;if(confirm(`Marcar tudo de ${S(a).name} como pago?`)){o.ls.forEach(l=>{L(l.id).paid=true});o.fees.forEach(y=>{db.fees[a+':'+y]=true});save();render();toast('Pagamento registrado')}},
 'nf-done'(a){db.nf[a]=true;save();render();toast('Nota fiscal registrada')},
 'save-settings'(){readForm();db.settings.name=ui.sheet.d.name.trim()||'Mili';db.settings.pix=ui.sheet.d.pix.trim();save();closeSheet();toast('Salvo')},
 export(){const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='aulas-backup-'+todayS()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)},
 import(){document.getElementById('imp').click()},
 close(){closeSheet()}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
 if(act==='ov'){if(e.target===el)closeSheet();return}
 if(A[act]){e.stopPropagation();A[act](el.dataset.arg)}
});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.chg;if(!c)return;readForm();const d=ui.sheet.d;
 if(c==='kind'&&d.kind==='escola'){d.pay='hora';d.vinc=d.vinc||'clt'}
 if(c==='sid'&&S(d.sid))d.dur=S(d.sid).dur||60;
 render()});
document.getElementById('imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students||!d.lessons)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){db=norm(d);save();closeSheet();toast('Backup importado')}}catch(x){toast('Arquivo inválido')}};r.readAsText(f);e.target.value=''});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
